# Publishes the prebuilt APK in personal-release/ as a GitHub release. The APK is built and signed
# locally (see PERSONAL_BUILD.md) so every release keeps the same signing key. It is stored in parts
# because GitHub doesn't accept files over 100 MB in commits.
name: Publish personal release

on:
  push:
    branches: [ personal ]
    paths:
      - "personal-release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join and verify the APK
        run: |
          cd personal-release
          cat FUTO-Keyboard-personal.apk.part* > FUTO-Keyboard-personal.apk
          sha256sum -c SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="personal-$(cat personal-release/VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" personal-release/FUTO-Keyboard-personal.apk --clobber
            gh release edit "$tag" --notes-file personal-release/NOTES.md
          else
            gh release create "$tag" personal-release/FUTO-Keyboard-personal.apk \
              --target "$GITHUB_SHA" \
              --title "FUTO Keyboard Personal $(cat personal-release/VERSION)" \
              --notes-file personal-release/NOTES.md \
              --latest
          fi
